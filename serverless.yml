# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: roofbuddy
service: sls-zoom-workflow
frameworkVersion: '~4.47.0'

useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  # The stage picks the AWS account. AWS_PROFILE is ignored once this is set,
  # which is how prod deploys silently landed in the stage account (Apr 2026).
  # An unmapped stage fails to resolve, so it cannot fall through to an account.
  profile: ${self:custom.awsProfile.${sls:stage}}
  memorySize: 128
  timeout: 30
  logRetentionInDays: 7
  environment:
    SUPABASE_URL: ${ssm:/zoom-workflow/supabase-url}
    SUPABASE_SERVICE_KEY: ${ssm:/zoom-workflow/supabase-service-key}
    ZOOM_WEBHOOK_SECRET: ${ssm:/zoom-workflow/zoom-webhook-secret}
    MONDAY_API_TOKEN: ${ssm:/zoom-workflow/monday-api-token}
    SLACK_BOT_TOKEN: ${ssm:/zoom-workflow/slack-bot-token}
    SLACK_CHANNEL_ID: ${ssm:/zoom-workflow/slack-channel-id}
    LIFX_TOKEN: ${ssm:/zoom-workflow/lifx-token, ''}
    LIFX_BULB_LABEL: ${ssm:/zoom-workflow/lifx-bulb-label, 'Call center bulb 1'}
    IDEMPOTENCY_TTL_SECONDS: "86400"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt EventsQueue.Arn

custom:
  firstNumberEnabled:
    prod: true
    dev: false
  awsProfile:
    dev: roofbuddy-stage
    prod: roofbuddy-prod
  eventsQueueName: sls-zoom-events-${self:provider.stage}.fifo
  dlqName: sls-zoom-events-dlq-${self:provider.stage}.fifo
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap:
      type: linked
      setNodeOptions: true
    external:
      - '@aws-sdk/*'

functions:
  ingress:
    handler: src/ingress.handler
    timeout: 10
    memorySize: 512
    environment:
      EVENTS_QUEUE_URL: https://sqs.${self:provider.region}.amazonaws.com/${aws:accountId}/${self:custom.eventsQueueName}
    events:
      - httpApi:
          path: /zoom/webhook
          method: POST

  processor:
    handler: src/processor.handler
    environment:
      FIRST_NUMBER_LANDING: ${ssm:/zoom-workflow/first-number/landing, ''}
    timeout: 30
    memorySize: 1024  # More memory = more CPU = faster cold starts and API fan-out
    events:
      - sqs:
          arn: !GetAtt EventsQueue.Arn
          batchSize: 1
          maximumBatchingWindow: 0  # Process immediately, don't wait for more messages
          functionResponseType: ReportBatchItemFailures

  proxy:
    handler: src/proxy.handler
    timeout: 30
    memorySize: 128
    events:
      - httpApi:
          path: /proxy/{source}/{webhookId}
          method: POST

  firstNumberVoice:
    handler: src/first-number-production.voice
    timeout: 14
    memorySize: 512
    role: FirstNumberVoiceRole
    environment:
      FIRST_NUMBER_STAGE: ${sls:stage}
      SUPABASE_SERVICE_KEY: ''
      MONDAY_API_TOKEN: ''
      ZOOM_WEBHOOK_SECRET: ''
      LIFX_TOKEN: ''
    events:
      - httpApi: { path: /incoming, method: POST }
      - httpApi: { path: /incoming-progress, method: POST }

  firstNumberLink:
    handler: src/first-number-production.link
    timeout: 110
    memorySize: 512
    role: FirstNumberLinkRole
    environment:
      FIRST_NUMBER_STAGE: ${sls:stage}
      ZOOM_WEBHOOK_SECRET: ''
      LIFX_TOKEN: ''
    events:
      - schedule:
          rate: rate(2 minutes)
          enabled: ${self:custom.firstNumberEnabled.${sls:stage}}

  dlqAlert:
    handler: src/dlq-alert.handler
    timeout: 10
    memorySize: 128
    events:
      - sqs:
          arn: !GetAtt EventsDLQ.Arn
          batchSize: 1

resources:
  Resources:
    FirstNumberVoiceRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ReadVoiceParameters
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameters
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zoom-workflow/first-number/twilio-account'
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zoom-workflow/first-number/route'

    FirstNumberLinkRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ReadVoiceParameters
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameters
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zoom-workflow/first-number/twilio-account'
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zoom-workflow/first-number/route'
                    - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zoom-workflow/first-number/zoom-call-history'

    # SQS: Dead Letter Queue
    EventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.dlqName}
        FifoQueue: true
        MessageRetentionPeriod: 1209600  # 14 days

    # SQS: Events Queue (FIFO)
    EventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.eventsQueueName}
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 90
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EventsDLQ.Arn
          maxReceiveCount: 3

  Outputs:
    WebhookUrl:
      Description: Webhook URL to configure in Zoom
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/zoom/webhook"
    ProxyUrl:
      Description: Webhook proxy base URL
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/proxy"
    EventsQueueUrl:
      Description: SQS FIFO queue URL
      Value: !Ref EventsQueue
    DLQUrl:
      Description: Dead Letter Queue URL
      Value: !Ref EventsDLQ
